name: Sincronizar propiedades desde Inmoweb

on:
  schedule:
    # 21:00 UTC = 22:00-23:00 hora de España según la época del año.
    # Siempre dentro de la ventana 18:00-09:00 en que el feed de Inmoweb está disponible.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      probar_aviso:
        description: 'Enviar un aviso de PRUEBA solo a oceanimmocosta@gmail.com (no avisa a los suscriptores)'
        type: boolean
        default: false
      avisar_suscriptores_ahora:
        description: 'ATENCION: envia un aviso REAL a TODOS los suscriptores (con una propiedad de ejemplo)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install fast-xml-parser@4.5.3

      - name: Descargar y convertir el feed de Inmoweb
        run: node scripts/sync-inmoweb.mjs
        env:
          INMOWEB_KEY: ${{ secrets.INMOWEB_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PROBAR_AVISO: ${{ inputs.probar_aviso }}
          REAVISAR: ${{ inputs.avisar_suscriptores_ahora }}

      - name: Generar páginas individuales por propiedad (SEO)
        run: node scripts/generate-property-pages.mjs

      - name: Generar páginas de listado por tipo (SEO)
        run: node scripts/generate-listing-pages.mjs

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add properties.json propiedades/ comprar.html comprar/ servicios.html servicios/
          git diff --staged --quiet || git commit -m "Actualización automática de propiedades desde Inmoweb"
          git push
